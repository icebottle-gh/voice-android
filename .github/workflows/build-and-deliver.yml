name: Build and Deliver APK

on:
  push:
    branches: 
      - master
      - main
      - 'S[0-9]*'  # Matches S1, S2, S3, S10, S11, etc.
  pull_request:
    branches: 
      - master
      - main
      - 'S[0-9]*'
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build debug APK
      run: ./gradlew assembleDebug
      
    - name: Get APK file path
      id: apk
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
        
    - name: Send APK via email (Push to branch)
      if: github.event_name == 'push'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "APK Build - Branch: ${{ github.ref_name }} - ${{ github.sha }}"
        to: ${{ secrets.EMAIL_TO }}
        from: ${{ secrets.EMAIL_FROM }}
        body: |
          New APK build is ready from sprint branch!
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Commit Message: ${{ github.event.head_commit.message }}
          Author: ${{ github.event.head_commit.author.name }}
          
          APK file (${{ steps.apk.outputs.apk_name }}) is attached.
          
          Build triggered by push to branch: ${{ github.ref_name }}
        attachments: ${{ steps.apk.outputs.apk_path }}

    - name: Send APK via email (Pull Request)
      if: github.event_name == 'pull_request'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "APK Build - PR #${{ github.event.pull_request.number }} to ${{ github.event.pull_request.base.ref }}"
        to: ${{ secrets.EMAIL_TO }}
        from: ${{ secrets.EMAIL_FROM }}
        body: |
          APK build ready for your Pull Request!
          
          Pull Request: #${{ github.event.pull_request.number }}
          Title: ${{ github.event.pull_request.title }}
          Author: ${{ github.event.pull_request.user.login }}
          Target Branch: ${{ github.event.pull_request.base.ref }}
          Source Branch: ${{ github.event.pull_request.head.ref }}
          
          Repository: ${{ github.repository }}
          Commit: ${{ github.event.pull_request.head.sha }}
          
          APK file (${{ steps.apk.outputs.apk_name }}) is attached for testing.
          
          PR Link: ${{ github.event.pull_request.html_url }}
        attachments: ${{ steps.apk.outputs.apk_path }}

    - name: Notify build failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "❌ Build Failed - ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
        to: ${{ secrets.EMAIL_TO }}
        from: ${{ secrets.EMAIL_FROM }}
        body: |
          ❌ APK build failed!
          
          Event: ${{ github.event_name }}
          Repository: ${{ github.repository }}
          ${{ github.event_name == 'pull_request' && format('Pull Request: #{0} - {1}', github.event.pull_request.number, github.event.pull_request.title) || format('Branch: {0}', github.ref_name) }}
          Commit: ${{ github.sha }}
          ${{ github.event_name == 'pull_request' && format('Author: {0}', github.event.pull_request.user.login) || format('Author: {0}', github.event.head_commit.author.name) }}
          
          Check the logs:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}